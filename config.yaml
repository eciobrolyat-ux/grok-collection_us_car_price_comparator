# API keys are read from a keybank vault at runtime (never stored in this
# file). Required secrets, by name (run `keybank list` to confirm yours):
#   rapidapi_key            - required if "cars_com" is in `sources`
#   marketcheck_api_key     - required if "marketcheck" is in `sources`
#   marketcheck_api-secret  - required if "marketcheck" is in `sources`

sources:
  - cars_com
  - marketcheck

regions:
  washington_dc:
    zip: "20001"
    radius: 100
    name: "Washington DC"
  houston:
    zip: "77002"
    radius: 100
    name: "Houston TX"
  los_angeles:
    zip: "90001"
    radius: 100
    name: "Los Angeles CA"
  miami:
    zip: "33101"
    radius: 100
    name: "Miami FL"
  chicago:
    zip: "60601"
    radius: 100
    name: "Chicago IL"
  denver:
    zip: "80202"
    radius: 100
    name: "Denver CO"

targets:
  - year: 2015
    make: Chevrolet
    model: Corvette
  - year: 2020
    make: Ford
    model: F-150
  - year: 2018
    make: Toyota
    model: Tacoma
  - year: 2016
    make: Porsche
    model: "911"
