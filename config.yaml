# API keys are read from a keybank vault at runtime (never stored in this
# file). Required secrets, by name (run `keybank list` to confirm yours):
#   rapidapi_key            - required if "cars_com" is in `sources`
#   marketcheck_api_key     - required if "marketcheck" is in `sources`
#   marketcheck_api_secret  - required if "marketcheck" is in `sources`

sources:
  # cars_com disabled temporarily -- rapidapi_key isn't stored correctly yet
  # - cars_com
  - marketcheck

regions:
  atlanta:
    zip: "30303"
    radius: 100
    name: "Atlanta GA"
  miami:
    zip: "33101"
    radius: 100
    name: "Miami FL"
  new_york_city:
    zip: "10001"
    radius: 100
    name: "New York NY"
  washington_dc:
    zip: "20001"
    radius: 100
    name: "Washington DC"
  chicago:
    zip: "60601"
    radius: 100
    name: "Chicago IL"
  los_angeles:
    zip: "90001"
    radius: 100
    name: "Los Angeles CA"
  phoenix:
    zip: "85001"
    radius: 100
    name: "Phoenix AZ"

# A target can use a single `year`, or `year_min`/`year_max` for a range --
# the scraper issues one search per year in the range (no reliance on a
# provider's own range-filtering support). Widen year_min for older years
# (e.g. down to 1950) if you want them, but most listing APIs like
# cars.com/MarketCheck mostly carry current-generation used cars, so pre-
# 1990s years will likely return few or no results while still costing
# a call each -- worth checking your provider's actual coverage first.
# Each year x region x source is a separate API call, so widening this
# multiplies quota usage fast (e.g. 10 years x 7 regions = 70 calls for
# just this one target).
targets:
  - year_min: 2017
    year_max: 2026
    make: Chevrolet
    model: Corvette
  # - year: 2020
  #   make: Ford
  #   model: F-150
  # - year: 2018
  #   make: Toyota
  #   model: Tacoma
  # - year: 2016
  #   make: Porsche
  #   model: "911"
